<ion-header [translucent]="true" class="header-container">
  <ion-toolbar>
    <div class="logo-container">
      <ion-img src="assets/logo-duoc.svg.png" class="logo"></ion-img>
    </div>
  </ion-toolbar>

  <ion-toolbar>
    <div class="title-container">
      <ion-title class="ion-text-center hover-text-animation">{{ 'HEADER.TITLE' | translate }}</ion-title>
    </div>
  </ion-toolbar>

  <ion-toolbar>
    <ion-segment [(ngModel)]="componente_actual" (ngModelChange)="cambiarComponente($event)">
      
      <ion-segment-button value="qr">
        <ion-label>{{ 'HEADER.SEGMENT_QR' | translate }}</ion-label>
      </ion-segment-button>

      <ion-segment-button value="miclase">
        <ion-label>{{ 'HEADER.SEGMENT_MICLASE' | translate }}</ion-label>
      </ion-segment-button>

      <ion-segment-button value="foro">
        <ion-label>{{ 'HEADER.SEGMENT_FORO' | translate }}</ion-label>
      </ion-segment-button> 

      <ion-segment-button value="misdatos">
        <ion-label>{{ 'HEADER.SEGMENT_MISDATOS' | translate }}</ion-label>
      </ion-segment-button>

      <ion-segment-button value="cerrarsesion">
        <ion-label>{{ 'HEADER.SEGMENT_EXIT' | translate }}</ion-label>
      </ion-segment-button>

    </ion-segment>
  </ion-toolbar>
</ion-header>

<ion-content>

  <app-qr [hidden]="componente_actual !== 'qr'" (qrCapturado)="cambiarComponente('miclase')"></app-qr>

  <app-miclase [hidden]="componente_actual !== 'miclase'"></app-miclase>

  <app-foro [hidden]="componente_actual !== 'foro'"></app-foro>

  <app-misdatos [hidden]="componente_actual !== 'misdatos'"></app-misdatos>
  
  <!-- Cerrar Sesión en la parte inferior -->
</ion-content>
